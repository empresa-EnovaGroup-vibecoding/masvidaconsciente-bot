name: Bot — verificar en cada push · desplegar PRODUCCIÓN solo a mano

# 🪦 EL TALLER MURIÓ EL 2026-09-01 (decisión de Maired: canceló el VPS de Hostinger — un solo
# cliente por entregar no justifica pagar dos servidores). Este flujo desplegaba el taller en
# cada push y le corría los bancos; todo eso se retiró. Lo que reemplaza al taller:
#   · la CI de abajo (ruff · compileall · pytest) en CADA push — la puerta sigue siendo la misma;
#   · los bancos corren en LOCAL antes de subir, y en producción A MANO cuando haga falta
#     (son seguros por diseño: limpian sus datos de prueba — se corrieron 27/27 allá el 1-sep);
#   · producción con la LISTA BLANCA puesta es el campo de pruebas seguro mientras no se abra.
#
# LO QUE SIGUE BLINDADO (no se toca):
#   • 🔒 La CI es la puerta: `desplegar` lleva `needs: verificar` — con ruff/compileall/pytest
#     en rojo, el deploy no llega a existir (lección L41).
#   • 🔒 PRODUCCIÓN ES SOLO A MANO: un push JAMÁS despliega nada. Desplegar exige un
#     `workflow_dispatch` lanzado por un humano que además elija "produccion" en el menú
#     (default "no": un click accidental no despliega).
#   • El deploy viaja CIFRADO (post-incidente 1-sep): la llave SSH entra al servidor y llama a
#     la API de Coolify por 127.0.0.1 — el token nunca viaja por HTTP público.
#   • Tras desplegar corren los DOS DETECTORES de esquema (solo lectura) dentro del contenedor
#     nuevo (DAT-7): si el esquema no está como el código cree, el flujo queda ROJO.
#
# Los tokens viven en los "Secrets" del repositorio (Settings → Secrets and variables → Actions).

on:
  push:
    branches: [master]      # ← solo corre la CI (verificar). NO despliega nada.
  workflow_dispatch:
    inputs:
      destino:
        description: 'Desplegar a PRODUCCIÓN (CLIENTES REALES). Elige "produccion" para confirmar.'
        type: choice
        options:
          - "no"
          - produccion
        default: "no"

jobs:
  # ✅ EL PORTERO (fase 0): si esto sale rojo, no se despliega nada. Corre en segundos y no
  # toca ni la BD, ni Redis, ni OpenRouter, ni WhatsApp.
  verificar:
    name: Verificar (ruff · compileall · pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # la misma que el Dockerfile (python:3.12-slim)
          cache: pip

      - name: Instalar dependencias de desarrollo
        # requirements-dev.txt incluye a requirements.txt: los tests importan `app.*`,
        # que necesita fastapi/sqlalchemy/httpx aunque no los llame.
        run: pip install -r requirements-dev.txt

      - name: ruff — el linter
        run: ruff check .

      - name: compileall — que todo parsee (la regla de CLAUDE.md §3)
        run: python -m compileall -q app

      - name: pytest — LAS REDES DE SEGURIDAD, caso por caso
        # Cada red nació de un incidente real con un cliente. Un cambio que rompa una red
        # no llega ni a poder desplegarse.
        run: pytest

  desplegar:
    needs: verificar   # 🔒 sin la puerta en verde, no se despliega nada
    # 🔒 Solo un humano, a mano, y confirmando "produccion" en el menú.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.destino == 'produccion' }}
    runs-on: ubuntu-latest
    steps:
      - name: PRODUCCIÓN (bot + worker, netcup, CLIENTES REALES)
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.PROD_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          {
            printf 'header = "Authorization: Bearer %s"\n' "${{ secrets.COOLIFY_NEW_TOKEN }}"
            printf 'url = "http://127.0.0.1:8000/api/v1/deploy?uuid=y20mosanb19cw8ukso56hv7e,hrkrh8f9buora7aqxt8rsbna"\n'
            printf 'fail\nsilent\nshow-error\nconnect-timeout = 20\nmax-time = 120\nretry = 3\nretry-all-errors\nretry-delay = 5\n'
          } | ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 root@152.53.89.118 \
            'curl --config -'

      # 🛡️ EL VIGILANTE DE PRODUCCIÓN (auditoría 2026-08-02, DAT-7).
      #
      # ⚠️ Aquí NO se corre `correr_bancos.py` automáticamente, y es a propósito: los bancos
      # ESCRIBEN en la base (pedidos, pagos y clientes de prueba) y esta base es la de los
      # CLIENTES REALES. Solo estos dos, que son de SOLO LECTURA:
      #   · `probar_migraciones` → la lista de columnas/índices que cada migración debía dejar.
      #   · `probar_drift`       → `models.py` ENTERO contra el esquema real de Postgres.
      # Si alguno sale rojo, este flujo queda ROJO: producción NO está como el código cree.
      # (Los 27 bancos completos se corren A MANO tras un deploy grande — el 1-sep salieron
      # 27/27 allá; limpian sus datos de prueba.)
      - name: PRODUCCIÓN — los dos detectores de esquema, DENTRO del contenedor nuevo
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.PROD_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 root@152.53.89.118 \
            'bash -s' -- "$GITHUB_SHA" <<'SCRIPT'
          set -e
          SHA="$1"
          echo "Esperando a que los contenedores NUEVOS (commit $SHA) estén corriendo…"
          # Se busca por el SHA de la imagen, NO por el nombre: los nombres que pone Coolify
          # cambian al recrear (pasó el 23-jul y nadie supo qué versión estaba viva). El SHA no miente.
          CONT=""
          for i in $(seq 1 60); do
            CONT=$(docker ps --format '{{.Names}} {{.Image}}' | grep "$SHA" | head -1 | cut -d' ' -f1 || true)
            CUANTOS=$(docker ps --format '{{.Image}}' | grep -c "$SHA" || true)
            if [ -n "$CONT" ] && [ "${CUANTOS:-0}" -ge 2 ]; then break; fi
            sleep 15
          done
          if [ -z "$CONT" ]; then
            echo "🔴 Ningún contenedor de producción corre el commit $SHA."
            echo "   ¿Falló el build en Coolify?"
            docker ps --format '{{.Names}} {{.Image}}'
            exit 1
          fi
          if [ "${CUANTOS:-0}" -lt 2 ]; then
            echo "🔴 Solo $CUANTOS contenedor(es) con el commit $SHA: falta el bot o el worker."
            docker ps --format '{{.Names}} {{.Image}}'
            exit 1
          fi
          echo "Contenedores nuevos: $CUANTOS · corriendo los detectores en $CONT (solo lectura)…"
          docker exec -w /app -e PYTHONPATH=/app "$CONT" python scripts/probar_migraciones.py
          docker exec -w /app -e PYTHONPATH=/app "$CONT" python scripts/probar_drift.py
          SCRIPT
